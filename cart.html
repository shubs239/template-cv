<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | Digi Pro CV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .template-selector input { display: none; }
        .selection-card { cursor: pointer; border: 2px solid #dee2e6 !important; transition: 0.3s; position: relative; }
        .template-selector input:checked + .selection-card { border-color: #0d6efd !important; background: #f8f9ff; }
        .check-icon { position: absolute; top: 15px; right: 15px; color: #0d6efd; font-size: 1.5rem; display: none; }
        .template-selector input:checked + .selection-card .check-icon { display: block; }
        
        /* Full Image Preview */
        .cv-preview-img { width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .data-box { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 20px; }
        .section-header { color: #0d6efd; font-weight: bold; border-bottom: 2px solid #f0f0f0; margin-bottom: 15px; padding-bottom: 5px; }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3"><h4 class="mb-0">Finalize Your CV Order</h4></div>
                    
                    <div class="card-body p-4">
                        <h5 class="mb-4 fw-bold">1. Select Template Plan</h5>
                        <div class="row g-4 mb-5">
                            <div class="col-md-6">
                                <label class="template-selector w-100">
                                    <input type="radio" name="plan" value="354" checked onchange="updateUI()">
                                    <div class="card selection-card p-3">
                                        <div class="check-icon"><i class="fas fa-check-circle"></i></div>
                                        <img src="/images/templatecv_image.jpeg" class="cv-preview-img mb-3">
                                        <div class="text-center fw-bold">Professional Plan - ₹354</div>
                                    </div>
                                </label>
                            </div>
                            <div class="col-md-6">
                                <label class="template-selector w-100">
                                    <input type="radio" name="plan" value="531" onchange="updateUI()">
                                    <div class="card selection-card p-3">
                                        <div class="check-icon"><i class="fas fa-check-circle"></i></div>
                                        <img src="/images/template2cv.png" class="cv-preview-img mb-3">
                                        <div class="text-center fw-bold">Premium Executive - ₹531</div>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <h5 class="mb-4 fw-bold">2. Review All Details</h5>
                        <div class="data-box mb-5">
                            <div class="row g-3">
                                <div class="col-md-4"><strong>Name:</strong> <div id="v-name"></div></div>
                                <div class="col-md-4"><strong>Designation:</strong> <div id="v-designation"></div></div>
                                <div class="col-md-4"><strong>Email:</strong> <div id="v-email"></div></div>
                                <div class="col-md-4"><strong>Phone:</strong> <div id="v-phone"></div></div>
                                <div class="col-md-4"><strong>LinkedIn:</strong> <div id="v-linkedin"></div></div>
                                <div class="col-md-4"><strong>Portfolio:</strong> <div id="v-portfolio"></div></div>
                                <div class="col-12"><strong>About:</strong> <div id="v-about" class="mt-1 text-muted"></div></div>
                            </div>

                            <div class="section-header mt-4">Experience</div>
                            <div id="v-experience"></div>

                            <div class="section-header mt-4">Education</div>
                            <div id="v-education"></div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="section-header mt-4">Skills</div>
                                    <div id="v-skills" class="d-flex flex-wrap gap-2"></div>
                                </div>
                                <div class="col-md-6">
                                    <div class="section-header mt-4">Languages</div>
                                    <div id="v-languages"></div>
                                </div>
                            </div>
                        </div>

                        <div class="p-4 bg-primary text-white rounded mb-4">
                            <div class="row align-items-center">
                                <div class="col-md-6">
                                    <select id="curr" class="form-select" onchange="updateUI()">
                                        <option value="INR">Pay in INR (India)</option>
                                        <option value="AED">Pay in AED (Dubai)</option>
                                        <option value="USD">Pay in USD</option>
                                    </select>
                                </div>
                                <div class="col-md-6 text-md-end mt-3 mt-md-0">
                                    <h2 id="v-total" class="fw-bold mb-0">₹354</h2>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/template_form.html" class="btn btn-outline-secondary btn-lg">Edit Data</a>
                            <a href="#" id="pay-btn" class="btn btn-success btn-lg px-5 shadow">Proceed to Payment</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    // 1. UPDATED PAYMENT LINK DATABASE
    // Each plan now contains unique URLs for every currency
    const pricing = {
        "354": { 
            "INR": { label: "₹354", url: "https://rzp.io/rzp/kAIssIUw" },
            "AED": { label: "20 AED", url: "https://rzp.io/rzp/1sHTlKAm" }, // Replace with your link
            "USD": { label: "10 USD", url: "https://rzp.io/rzp/AEUFAPM1" }  // Replace with your link
        },
        "531": { 
            "INR": { label: "₹531", url: "https://rzp.io/rzp/t30ToQt" }, // Replace with your link
            "AED": { label: "40 AED", url: "https://rzp.io/rzp/1qAPcAB6" }, // Replace with your link
            "USD": { label: "15 USD", url: "https://rzp.io/rzp/MjTdTg0l" }  // Replace with your link
        }
    };

    // 2. UPDATED UI LOGIC
    function updateUI() {
        const planValue = document.querySelector('input[name="plan"]:checked').value;
        const cur = document.getElementById('curr').value;
        
        // 1. Handle Template ID for Lambda
        const templateId = (planValue === "354") ? 1 : 2;
        localStorage.setItem('selectedTemplateId', templateId);
        sessionStorage.setItem('selectedTemplateId', templateId);

        // 2. Fetch the specific configuration for selected Plan + Currency
        const config = pricing[planValue][cur];

        // 3. Update the Price Label and the Payment Button URL
        document.getElementById('v-total').textContent = config.label;
        document.getElementById('pay-btn').href = config.url;

        // Console log to verify the link change
        // console.log(`Plan: ${templateId} | Currency: ${cur} | Link: ${config.url}`);
    }

    // 3. RENDER ALL DETAILS
    function renderDetails(data) {
        if (!data) return;

        // Basic Fields
        document.getElementById('v-name').textContent = data.name || 'N/A';
        document.getElementById('v-designation').textContent = data.designation || 'N/A';
        document.getElementById('v-email').textContent = data.email || 'N/A';
        document.getElementById('v-phone').textContent = data.phone || 'N/A';
        document.getElementById('v-linkedin').textContent = data.linkedin || 'N/A';
        document.getElementById('v-portfolio').textContent = data.portfolio || 'N/A';
        document.getElementById('v-about').textContent = data.about || 'N/A';

        // Experience Rendering
        const expContainer = document.getElementById('v-experience');
        expContainer.innerHTML = (data.experience && data.experience.length > 0) 
            ? data.experience.map(exp => `
                <div class="mb-2">
                    <strong>${exp.company}</strong> — ${exp.title} (${exp.start_year} - ${exp.end_year})
                </div>
            `).join('') 
            : '<div class="text-muted italic">No experience added</div>';

        // Education Rendering
        const eduContainer = document.getElementById('v-education');
        eduContainer.innerHTML = (data.education && data.education.length > 0)
            ? data.education.map(edu => `
                <div class="mb-2">
                    <strong>${edu.school}</strong> — ${edu.degree} (${edu.year})
                </div>
            `).join('')
            : '<div class="text-muted italic">No education added</div>';

        // Skills Rendering
        const skillContainer = document.getElementById('v-skills');
        skillContainer.innerHTML = (data.skills && data.skills.length > 0)
            ? data.skills.map(s => `<span class="badge bg-light text-primary border border-primary px-3 py-2">${s.name} ${s.level ? '(' + s.level + ')' : ''}</span>`).join('')
            : '<div class="text-muted italic w-100">No skills added</div>';

        // Languages Rendering
        const langContainer = document.getElementById('v-languages');
        langContainer.innerHTML = (data.languages && data.languages.length > 0)
            ? data.languages.map(l => `<div class="small">• ${l.name} (${l.level})</div>`).join('')
            : '<div class="text-muted italic">No languages added</div>';
    }

    // 4. TRIGGER ON LOAD
    document.addEventListener('DOMContentLoaded', () => {
        const rawData = localStorage.getItem('cvData') || sessionStorage.getItem('cvData');
        
        if (rawData) {
            const data = JSON.parse(rawData);
            renderDetails(data);
            updateUI(); // Run once to set initial price and link
        } else {
            console.error("No CV data found in storage!");
        }
    });
</script>
