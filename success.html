<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Download CV – Digi Pro CV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-center py-5">
  <div class="container">
    <h2 class="mb-3">Payment successful 🎉</h2>
    <p class="text-muted">Generating your professional CV…</p>
    <button id="dlBtn" class="btn btn-primary btn-lg mt-3">Download CV</button>
    <div id="msg" class="mt-3"></div>
  </div>

<script>
const cvData  = JSON.parse(sessionStorage.getItem('cvData') || '{}');
const cvPhoto = sessionStorage.getItem('cvPhoto');
// console.log(cvData, cvPhoto);
document.getElementById('dlBtn').onclick = async () => {
  const btn = document.getElementById('dlBtn');
  btn.disabled = true; btn.textContent = 'Building…';

  try {
    const res = await fetch('https://49tvi6iekj.execute-api.ap-south-1.amazonaws.com/prod', {
      method : 'POST',
      headers: {'Content-Type':'application/json'},
      body   : JSON.stringify({...cvData, image_64: cvPhoto})
    });
    if (!res.ok) throw new Error('PDF failed');
    const blob = await res.blob();
    const url  = window.URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url; a.download = 'MyCV.pdf'; a.click();
    window.URL.revokeObjectURL(url);
    btn.textContent = 'Done ✓';
  } catch (e) {
    document.getElementById('msg').textContent = 'Error: ' + e;
    btn.disabled = false; btn.textContent = 'Retry';
  }
};
</script>
</body>
</html>
